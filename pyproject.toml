[project]
name = "bazaar-agent"
version = "0.1.0"
description = "Team 1's autonomous trading agent for The Bazaar (Causa Prima hackathon, Madrid 2026)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "psycopg[binary]>=3.2",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "openinference-semantic-conventions>=0.1.41",
  "anthropic>=1.11.0",
  "openai>=3.24.0",
  "websockets>=13",
  "claude-agent-sdk==0.2.163",
  # The remote MCP server (`bazaar mcp serve`): MCP Python SDK 2.x low-level Server + Streamable HTTP.
  "mcp>=2.2,<3",
  "uvicorn>=0.30",
]

[project.scripts]
bazaar = "bazaar_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
]
# Railway IaC authoring (.railway/railway.py): `uv run --group infra railway config plan`.
infra = ["railway-sdk==0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/bazaar-kit"]
markers = ["integration: needs the local Postgres (uv run bazaar db up)"]

[tool.coverage.run]
source = ["bazaar_agent"]
omit = ["src/bazaar_agent/cli.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "vendor/bazaar-kit"]
ignore_missing_imports = true
