name: readme

# Refreshes compact README project metadata and the implementation architecture after merges.
# Backlog, memory and activity history stay in their own sources instead of inflating the README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild README project metadata
        run: python3 scripts/readme_status.py
      - name: Rebuild the architecture page
        run: python3 scripts/architecture_page.py
      - name: Commit when it changed
        run: |
          if git diff --quiet -- README.md docs/architecture.html; then
            echo "README and architecture page already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.html
          git commit -m "docs: refresh README metadata and architecture page [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
