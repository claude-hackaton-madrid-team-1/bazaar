name: readme

# Keeps the root README current after every merge: the "Live status" block (plan backlog, CLI
# commands, team memory) on the merged code, and the "Activity" block (recent merges, open PRs).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
      - name: Rebuild the README blocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/readme_status.py --activity
      - name: Commit when it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README live status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
