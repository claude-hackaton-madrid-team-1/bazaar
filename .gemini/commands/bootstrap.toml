description = "One-time project setup — interview for stack/requirements, fill .ai/context.md, and regenerate every tool's config"
prompt = """
Invoke the agent-skills:project-bootstrap skill.

Use this once, right after starting from the cross-ai-template, while `.ai/context.md` still
has `<!-- FILL: … -->` placeholders. (Don't confuse it with the built-in `/init`.)

The template machinery is **language-agnostic** — the sync generator is a dependency-free
POSIX shell script (`scripts/sync-ai-docs.sh`), and the git hooks are empty dispatchers. Your
job at bootstrap is to fill the contract AND wire the chosen language's quality gates into
those hooks.

Interview the user one question at a time, with your best guess attached, to gather:
1. **Project** — what it does, who uses it, and the dominant correctness/quality constraint.
2. **Stack (locked)** — runtime/language, framework, validation, datastore + ORM, queue/cache,
   logger, test runner, linter/formatter, and explicit NOs. Infer from the repo, then confirm.
3. **Definition of Done** — test command + coverage threshold, typecheck command, lint command,
   and any project-specific gates.
4. **Hard rules** — project-specific additions to the always/never list.
5. **Language for the commit hooks** — confirm the language whose format/lint/typecheck/test
   commands should run on pre-commit (and tests on post-commit). Default to the Stack language.

Then:
- Replace the `<!-- FILL -->` markers in `.ai/context.md` with the answers; leave the
  Source-of-truth and Memory-protocol sections untouched. Set the title to the project name.
- **Wire the commit hooks for the language** (see the skill's per-language table): write
  executable scripts into `.githooks/pre-commit.d/` (format, lint, typecheck on staged files)
  and `.githooks/post-commit.d/` (tests), using the exact Definition-of-Done commands. Do NOT
  edit `.githooks/pre-commit` / `post-commit` themselves — they already dispatch the `.d/` dirs
  and run the agnostic sync gate.
- Append the language's ignore patterns to `.gitignore` (e.g. `node_modules/`, `target/`,
  `__pycache__/`, `vendor/`).
- Optionally seed `.ai/specs/00-requirements.md`, or hand off to `/spec` for the full spec.
- Run `sh scripts/install.sh` (wires `core.hooksPath` + runs the sync), or just
  `sh scripts/sync-ai-docs.sh` if hooks are already installed, to regenerate AGENTS.md,
  CLAUDE.md, GEMINI.md, and every tool mirror.
- Show the diff, remind the human to commit, and point them to `/spec → /plan → /build`.

Do NOT overwrite an already-filled `.ai/context.md` without confirming. Never invent stack
choices — infer and confirm, or ask. Never write secrets. Never hard-code a runtime into the
template machinery — only into the `.githooks/*.d/` scripts you generate for this project.
"""
